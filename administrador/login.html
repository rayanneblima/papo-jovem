<!DOCTYPE html>
<html lang="pt-br">
<head>
	<title>Login | Papo Jovem!</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="icon" type="image/png" href="../images/icons/favicon.png"/>
	<link rel="stylesheet" type="text/css" href="../vendor/bootstrap/css/bootstrap.min.css">
	<link rel="stylesheet" type="text/css" href="../fonts/font-awesome-4.7.0/css/font-awesome.min.css">
	<link rel="stylesheet" type="text/css" href="../css/util.css">
	<link rel="stylesheet" type="text/css" href="../css/main.css">
	<style type="text/css">
		textarea.input100 { height: 160px; padding-top: 18px; padding-bottom: 18px; }
		.aviso { width: 100%; text-align: center; color: #666; font-size: 13px; margin-top: 12px; }
	</style>
</head>
<body>
	<div class="limiter">
		<div class="container-login100">
			<div class="wrap-login100 p-t-50 p-b-90">

				<form id="form" class="login100-form validate-form flex-sb flex-w">
					<span class="login100-form-title p-b-51">Papo Jovem!</span>
					<div class="wrap-input100 validate-input m-b-16" data-validate="E-mail obrigatório.">
						<input class="input100" type="email" name="emailuser" placeholder="e-mail" value="admin@papojovem.com">
						<span class="focus-input100"></span>
					</div>
					<div class="wrap-input100 validate-input m-b-16" data-validate="Senha obrigatória.">
						<input class="input100" type="password" name="senha" placeholder="senha" value="papojovem2018">
						<span class="focus-input100"></span>
					</div>
					<div class="container-login100-form-btn m-t-17">
						<button class="login100-form-btn" type="submit">entrar</button>
					</div>
					<p class="aviso">Versão de demonstração, aberta para todos:<br>e-mail <b>admin@papojovem.com</b> · senha <b>papojovem2018</b></p>
				</form>
				<a href="../index.html" style="width: 100%"><div class="container-login100-form-btn m-t-17">
					<span class="login100-form-btn"><font color="white">Início</font></span>
				</div></a>
			</div>
		</div>
	</div>

	<script src="../vendor/jquery/jquery-3.2.1.min.js"></script>
	<script src="../js/main.js"></script>
	<script src="../js/dados.js"></script>
	<script src="../js/admin.js"></script>
	<script>

		// Credencial pública de demonstração, já preenchida no formulário.
		PJ.aoEnviar('#form', function (dados) {
			if (dados.get('emailuser').trim() !== 'admin@papojovem.com' || dados.get('senha') !== 'papojovem2018') {
				alert('Usuário ou senha inválido! Tente novamente.');
				return;
			}
			location.href = 'index.html';
		});
	</script>
</body>
</html>
