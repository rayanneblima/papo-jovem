<!DOCTYPE html>
<html lang="pt-br">
<head>
	<title>Editar Enquete | Papo Jovem!</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="icon" type="image/png" href="../images/icons/favicon.png"/>
	<link rel="stylesheet" type="text/css" href="../vendor/bootstrap/css/bootstrap.min.css">
	<link rel="stylesheet" type="text/css" href="../fonts/font-awesome-4.7.0/css/font-awesome.min.css">
	<link rel="stylesheet" type="text/css" href="../css/util.css">
	<link rel="stylesheet" type="text/css" href="../css/main.css">
	<style type="text/css">
		textarea.input100 { height: 160px; padding-top: 18px; padding-bottom: 18px; }
		.aviso { width: 100%; text-align: center; color: #666; font-size: 13px; margin-top: 12px; }
	</style>
</head>
<body>
	<div class="limiter">
		<div class="container-login100">
			<div class="wrap-login100 p-t-50 p-b-90">

				<form id="form" class="login100-form validate-form flex-sb flex-w">
					<span class="login100-form-title p-b-51">Editar enquete:</span>
					<div class="wrap-input100 validate-input m-b-16" data-validate="Pergunta obrigatória.">
						<input class="input100" type="text" name="pergunta" placeholder="pergunta">
						<span class="focus-input100"></span>
					</div>
					<div class="wrap-input100 validate-input m-b-16" data-validate="Categoria obrigatória.">
						<input class="input100" type="text" name="categoria" placeholder="categoria">
						<span class="focus-input100"></span>
					</div>
					<div class="wrap-input100 validate-input m-b-16" data-validate="Opção 'a' obrigatória.">
						<input class="input100" type="text" name="a" placeholder="(a)">
						<span class="focus-input100"></span>
					</div>
					<div class="wrap-input100 validate-input m-b-16" data-validate="Opção 'b' obrigatória.">
						<input class="input100" type="text" name="b" placeholder="(b)">
						<span class="focus-input100"></span>
					</div>
					<div class="wrap-input100 m-b-16">
						<input class="input100" type="text" name="c" placeholder="(c)">
						<span class="focus-input100"></span>
					</div>
					<div class="wrap-input100 m-b-16">
						<input class="input100" type="text" name="d" placeholder="(d)">
						<span class="focus-input100"></span>
					</div>
					<div class="container-login100-form-btn m-t-17">
						<button class="login100-form-btn" type="submit" onclick="return confirm('Deseja atualizar o registro?');">editar</button>
					</div>
				</form>
				<a href="adm_enquetes.html" style="width: 100%"><div class="container-login100-form-btn m-t-17">
					<span class="login100-form-btn"><font color="white">Voltar</font></span>
				</div></a>
			</div>
		</div>
	</div>

	<script src="../vendor/jquery/jquery-3.2.1.min.js"></script>
	<script src="../js/main.js"></script>
	<script src="../js/dados.js"></script>
	<script src="../js/admin.js"></script>
	<script>

		function camposEnquete(dados) {
			var e = {};
			['pergunta', 'categoria', 'a', 'b', 'c', 'd'].forEach(function (k) { e[k] = dados.get(k).trim(); });
			return e;
		}
		var e = PJ.buscar('enquetes', PJ.param('id'));
		if (!e) { alert('Enquete não encontrada.'); location.replace('adm_enquetes.html'); }
		var f = document.getElementById('form');
		['pergunta', 'categoria', 'a', 'b', 'c', 'd'].forEach(function (k) { f[k].value = e[k] || ''; });
		PJ.aoEnviar('#form', function (dados) {
			if (!PJ.atualizar('enquetes', e.id, camposEnquete(dados))) return;
			alert('Atualizada com sucesso!');
			location.replace('adm_enquetes.html');
		});
	</script>
</body>
</html>
