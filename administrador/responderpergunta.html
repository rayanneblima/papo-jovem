<!DOCTYPE html>
<html lang="pt-br">
<head>
	<title>Responder Pergunta | Papo Jovem!</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="icon" type="image/png" href="../images/icons/favicon.png"/>
	<link rel="stylesheet" type="text/css" href="../vendor/bootstrap/css/bootstrap.min.css">
	<link rel="stylesheet" type="text/css" href="../fonts/font-awesome-4.7.0/css/font-awesome.min.css">
	<link rel="stylesheet" type="text/css" href="../css/util.css">
	<link rel="stylesheet" type="text/css" href="../css/main.css">
	<style type="text/css">
		textarea.input100 { height: 160px; padding-top: 18px; padding-bottom: 18px; }
		.aviso { width: 100%; text-align: center; color: #666; font-size: 13px; margin-top: 12px; }
	</style>
</head>
<body>
	<div class="limiter">
		<div class="container-login100">
			<div class="wrap-login100 p-t-50 p-b-90">

				<form id="form" class="login100-form validate-form flex-sb flex-w">
					<span class="login100-form-title p-b-51">Responder pergunta:</span>
					<div class="wrap-input100 m-b-16">
						<textarea class="input100" name="perg" placeholder="pergunta"></textarea>
						<span class="focus-input100"></span>
					</div>
					<div class="wrap-input100 m-b-16">
						<textarea class="input100" name="resp" placeholder="resposta"></textarea>
						<span class="focus-input100"></span>
					</div>
					<div class="container-login100-form-btn m-t-17">
						<button class="login100-form-btn" type="submit" onclick="return confirm('Deseja confirmar a resposta?');">responder</button>
					</div>
				</form>
				<a href="index.html" style="width: 100%"><div class="container-login100-form-btn m-t-17">
					<span class="login100-form-btn"><font color="white">Voltar</font></span>
				</div></a>
			</div>
		</div>
	</div>

	<script src="../vendor/jquery/jquery-3.2.1.min.js"></script>
	<script src="../js/main.js"></script>
	<script src="../js/dados.js"></script>
	<script src="../js/admin.js"></script>
	<script>

		var p = PJ.buscar('perguntas', PJ.param('id'));
		if (!p) { alert('Pergunta não encontrada.'); location.replace('index.html'); }
		var f = document.getElementById('form');
		f.perg.value = p.perg; f.resp.value = p.resp;
		PJ.aoEnviar('#form', function (dados) {
			if (!PJ.atualizar('perguntas', p.id, { perg: dados.get('perg').trim(), resp: dados.get('resp').trim() })) return;
			alert('Resposta salva!');
			location.replace('index.html');
		});
	</script>
</body>
</html>
